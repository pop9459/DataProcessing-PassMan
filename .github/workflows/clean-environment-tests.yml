name: Clean Environment Tests

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  integration-tests:
    name: Integration tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore DataProcessing-PassMan.sln

      - name: Build solution
        run: dotnet build DataProcessing-PassMan.sln --configuration Release --no-restore

      - name: Run API tests
        run: dotnet test PassManAPI.Tests/PassManAPI.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/*.trx'
