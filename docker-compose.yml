services:
  passman-api:
    build:
      context: ./PassManAPI
      dockerfile: dockerfile.dev
    working_dir: /app
    ports:
      - "5246:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=passManDB;User=passman_app;Password=${DB_APP_PASSWORD:-passman_app_dev_pw};Pooling=true
      - Jwt__SigningKey=${JWT_SIGNING_KEY:-dev-only-signing-key-change-me-32chars}
      # Google OAuth client id. The API validates that incoming Google id tokens were issued for
      # this client (audience check), so it must be configured server-side, not only on the GUI.
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      # Suppress verbose EF Core SQL query logs — use Warning to keep errors visible
      - Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command=Warning
    command: dotnet watch --project PassManAPI.csproj run --urls http://0.0.0.0:8080
    volumes:
      - ./PassManAPI:/app
      # Exclude build artifacts to prevent permission issues
      - /app/obj
      - /app/bin
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  passman-gui:
    build:
      context: ./PassManGUI
      dockerfile: dockerfile.dev
    working_dir: /app
    ports:
      - "5247:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - ApiBaseUrl=http://passman-api:8080
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
    command: dotnet watch --project PassManGUI.csproj run --urls http://0.0.0.0:8080
    volumes:
      - ./PassManGUI:/app
      # Exclude build artifacts to prevent permission issues
      - /app/obj
      - /app/bin
    depends_on:
      - passman-api

  # Test service - run tests in Docker environment
  test:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /workspace
    environment:
      - ASPNETCORE_ENVIRONMENT=Test
    volumes:
      - .:/workspace
      # Exclude build artifacts to prevent permission issues
      - /workspace/PassManAPI/obj
      - /workspace/PassManAPI/bin
      - /workspace/PassManAPI.Tests/obj
      - /workspace/PassManAPI.Tests/bin
    entrypoint: ["dotnet"]
    command: test PassManAPI.Tests/PassManAPI.Tests.csproj --logger "console;verbosity=detailed"
    profiles:
      - test

  # E2E test runner — run with: docker compose --profile e2e up --abort-on-container-exit
  # Uses the Docker-internal URL (passman-api:8080) so no port mapping needed.
  # The collection's baseUrl collection variable (http://localhost:5246) is overridden at runtime.
  newman:
    image: postman/newman:alpine
    volumes:
      - ./scripts:/etc/newman
    command: >
      run PASSMAN-tests.postman_collection.json
      --env-var "baseUrl=http://passman-api:8080"
      --reporters cli
    depends_on:
      passman-api:
        condition: service_healthy
    profiles:
      - e2e

  db:
   image: mysql:8.0
   container_name: db
   # MySQL 8.0 enables binary logging by default, which would otherwise require SUPER for the
   # non-root app account to create the startup trigger/stored procedures (see DatabaseArtifacts).
   command: --log-bin-trust-function-creators=1
   ports:
     - "3306:3306"
   environment:
     - MYSQL_ROOT_PASSWORD=hihi
     - MYSQL_DATABASE=passManDB
     # Dedicated least-privilege application account. The MySQL image grants this user ALL
     # privileges on passManDB only (no other databases, no server-admin rights). The API uses it
     # instead of root; root stays for DB administration / the healthcheck.
     - MYSQL_USER=passman_app
     - MYSQL_PASSWORD=${DB_APP_PASSWORD:-passman_app_dev_pw}
   volumes:
     - mysql-data:/var/lib/mysql
   healthcheck:
     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-phihi"]
     interval: 5s
     timeout: 5s
     retries: 10

volumes:
  mysql-data:
    driver: local